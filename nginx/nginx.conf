worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rid=$request_id $request_time';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 256;

    # 10 запросов/с на IP, всплеск до 20
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream backend {
        least_conn;
        server app:8000;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 10M;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # проверка домена для Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /static/ {
            alias /var/www/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            # эти заголовки ставит nginx, копии от приложения убираем
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # 429/502/504 отдаём в едином JSON-формате
        error_page 429 = @too_many;
        error_page 502 504 = @upstream_down;
        location @too_many {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests"}}';
        }
        location @upstream_down {
            default_type application/json;
            return 503 '{"error":{"code":"unavailable","message":"Upstream is not responding"}}';
        }
    }

    # HTTPS: раскомментировать после получения сертификата (certbot), домен подставить свой
    # server {
    #     listen 443 ssl;
    #     http2 on;
    #     server_name your-domain.com;
    #     ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    #     add_header Strict-Transport-Security "max-age=31536000" always;
    #     ... (те же location, что и в блоке server на порту 80)
    # }
}
