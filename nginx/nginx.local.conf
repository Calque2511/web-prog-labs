# локальный вариант без Docker: прокси на 127.0.0.1:8000, HTTPS с самоподписанным сертификатом
# запуск: tools/nginx-1.26.2/nginx.exe -p tools/nginx-1.26.2/ -c ../../nginx/nginx.local.conf
worker_processes 1;
events { worker_connections 256; }
error_log logs/error.log warn;
pid       logs/nginx.pid;

http {
    include       ../tools/nginx-1.26.2/conf/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr "$request" $status $body_bytes_sent "$http_x_forwarded_for" '
                    'rid=$request_id rt=$request_time ua=$upstream_addr';
    access_log logs/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 20;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    upstream backend {
        least_conn;
        server 127.0.0.1:8000;
        server 127.0.0.1:8001 backup;
    }

    server {
        listen 8080;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate     certs/fullchain.pem;
        ssl_certificate_key certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 10M;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        location /static/ {
            alias ../../nginx/static/;
            expires 30d;
            add_header Cache-Control "public";
        }

        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://backend;
            # эти заголовки ставит nginx, копии от приложения убираем
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        error_page 429 = @too_many;
        error_page 502 504 = @upstream_down;
        location @too_many {
            default_type application/json;
            return 429 '{"error":{"code":"rate_limited","message":"Too many requests"}}';
        }
        location @upstream_down {
            default_type application/json;
            return 503 '{"error":{"code":"unavailable","message":"Upstream is not responding"}}';
        }
    }
}
