# тестовые БД и Redis; TEST_DATABASE_URL=postgresql+psycopg2://test:test@localhost:5433/test_db pytest
services:
  test-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data   # данные не переживают контейнер
  test-redis:
    image: redis:alpine
    ports:
      - "6380:6379"
